<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arcade Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#0b0c18;--bg2:#12132a;--panel:rgba(255,255,255,.045);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.2);--text:#eef0ff;--muted:#9a9fc4;--a1:#9fb4ff;--a2:#ff9ad5;--a3:#ffd38a;--glow1:#2a1f5a;--glow2:#3a1440;--fs:1}
html[data-theme="midnight"]{--bg:#050608;--bg2:#0c0e14;--panel:rgba(255,255,255,.035);--glow1:#0d2238;--glow2:#08251f}
html[data-theme="dusk"]{--bg:#1a0f1f;--bg2:#251528;--glow1:#5a1f3a;--glow2:#4a2a10}
html[data-theme="light"]{--bg:#f4f3fb;--bg2:#ffffff;--panel:rgba(20,20,60,.04);--panel2:rgba(20,20,60,.08);--line:rgba(20,20,60,.1);--line2:rgba(20,20,60,.25);--text:#1a1b33;--muted:#62668c;--glow1:#dcd6ff;--glow2:#ffd9ec}
html[data-accent="ocean"]{--a1:#5ee7df;--a2:#4a8cff;--a3:#b4f0ff}
html[data-accent="sunset"]{--a1:#ffb347;--a2:#ff5e62;--a3:#ffd38a}
html[data-accent="lime"]{--a1:#c6ff6b;--a2:#3ddc84;--a3:#f6ff9b}
html[data-accent="mono"]{--a1:#ffffff;--a2:#b8bcd8;--a3:#ffffff}
html[data-text="large"]{--fs:1.12}
html[data-motion="reduce"] *{transition:none!important;animation:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
body{-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.grad{background:linear-gradient(120deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
/* ---------- hub ---------- */
#hub{position:fixed;inset:0;overflow-y:auto;background:radial-gradient(1200px 600px at 15% -10%,var(--glow1) 0%,transparent 60%),radial-gradient(900px 500px at 105% 5%,var(--glow2) 0%,transparent 55%),var(--bg);scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-style:normal;font-size:16px;box-shadow:0 4px 18px color-mix(in srgb,var(--a2) 40%,transparent)}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
.search input{width:100%;font-size:calc(14px*var(--fs));padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none;transition:border-color .15s,background .15s}
.search input:focus{border-color:var(--a1);background:var(--panel2)}
.search:before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-52%);font-size:18px;opacity:.5}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px 'Space Grotesk';opacity:.45;border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px;flex:none;transition:background .15s,transform .15s}
.iconbtn:hover{background:var(--panel2)}
.iconbtn:active{transform:scale(.94)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin:26px auto 8px}
.hero-main{border-radius:24px;padding:28px;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 22%,transparent),color-mix(in srgb,var(--a2) 18%,transparent));border:1px solid var(--line);position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-main h1{font-size:calc(clamp(34px,5.5vw,56px)*var(--fs));letter-spacing:-2px;line-height:1}
.hero-main p{color:var(--muted);margin-top:10px;max-width:440px;font-size:calc(15px*var(--fs))}
.hero-main .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero-main .deco{position:absolute;right:-10px;top:-10px;font-size:120px;opacity:.18;transform:rotate(12deg);pointer-events:none;line-height:1}
.hero-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{border-radius:18px;padding:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.kpi b{font-size:30px;letter-spacing:-1px}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.btn{font-weight:700;font-size:calc(16px*var(--fs));padding:12px 26px;border-radius:999px;border:0;color:#0b0c1a;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 28px color-mix(in srgb,var(--a2) 35%,transparent);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:none;border:1px solid var(--line2)}
.sec{margin:30px auto 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-size:calc(20px*var(--fs));letter-spacing:-.5px}
.sec small{color:var(--muted);font-size:13px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.mini{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:1px solid var(--line);background:var(--panel);text-align:left;transition:background .15s,transform .15s;min-width:0}
.mini:hover{background:var(--panel2);transform:translateY(-2px)}
.mini .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px;flex:none}
.mini b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:calc(13px*var(--fs));font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip em{font-style:normal;opacity:.55;margin-left:4px;font-size:11px}
select.chip{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select.chip option{background:var(--bg2);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,220px),1fr));gap:14px;margin-top:14px;padding-bottom:60px}
html[data-density="compact"] .grid{--cw:170px}
.card{position:relative;text-align:left;border:1px solid var(--line);border-radius:20px;padding:10px 10px 14px;background:var(--panel);overflow:hidden;transition:transform .18s cubic-bezier(.2,.8,.3,1.3),border-color .15s,background .15s,box-shadow .18s;display:flex;flex-direction:column;min-width:0}
.card:hover{transform:translateY(-4px);border-color:var(--line2);background:var(--panel2);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.card .art{aspect-ratio:16/10;border-radius:14px;display:grid;place-items:center;font-size:44px;position:relative;overflow:hidden}
.card .art:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 55%),repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 8px,transparent 8px 16px)}
.card .art span{position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));transition:transform .2s}
.card:hover .art span{transform:scale(1.12) rotate(-4deg)}
html[data-density="compact"] .card .art{font-size:34px}
.card h3{font-size:calc(16px*var(--fs));margin:10px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .d{font-size:calc(12.5px*var(--fs));color:var(--muted);line-height:1.4;margin:0 4px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[data-density="compact"] .card .d{display:none}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 0;font-size:11.5px;color:var(--muted)}
.tag{padding:2px 8px;border-radius:999px;background:var(--panel2);font-weight:700;letter-spacing:.4px;color:var(--text)}
.tag.d3{background:linear-gradient(120deg,#5b6cff,#c04bff);color:#fff}
.fav{position:absolute;top:16px;right:16px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:15px;display:grid;place-items:center;opacity:0;transition:opacity .15s,transform .15s;backdrop-filter:blur(4px)}
.card:hover .fav,.fav.on{opacity:1}
.fav.on{color:#ffd23f}
.fav:active{transform:scale(.85)}
.badge{position:absolute;top:16px;left:16px;z-index:2;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 7px;border-radius:6px;background:#fff;color:#111}
.empty{text-align:center;color:var(--muted);padding:50px 0}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-side{grid-template-columns:repeat(4,1fr)}.kpi{padding:12px}.kpi b{font-size:22px}.kpi span{font-size:10px}.search kbd{display:none}.logo span{display:none}.fav{opacity:1}.grid{--cw:150px;gap:10px}.card .d{display:none}.card .art{font-size:34px}.card h3{font-size:14px}}
/* ---------- play view ---------- */
#play{position:fixed;inset:0;display:none;background:#000}
#play.on{display:block}
#stage{position:absolute;inset:0;overflow:hidden}
#stage canvas{display:block}
.gbar{position:absolute;top:8px;left:8px;right:8px;z-index:50;display:flex;align-items:center;gap:6px;pointer-events:none}
.gbar>*{pointer-events:auto}
.gbar .pill{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(12,12,28,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gbar button{height:34px;min-width:34px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .15s}
.gbar button:hover{background:rgba(255,255,255,.12)}
.gbar .title{color:#fff;font-weight:700;font-size:14px;padding:0 10px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.gbar .sp{flex:1}
/* shared game ui */
.ov{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(6,6,16,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:70px 16px 20px;animation:fadeIn .2s}
.ov.hide{display:none}
.ov>.box{width:min(440px,100%);max-height:100%;overflow:auto;border-radius:24px;padding:28px 24px 24px;background:linear-gradient(180deg,rgba(40,40,72,.92),rgba(20,20,40,.95));border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:#eef0ff;animation:pop .25s cubic-bezier(.2,.8,.3,1.3)}
.ov .gico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;margin-bottom:2px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.ov h2{font-size:clamp(26px,5vw,36px);letter-spacing:-1px;line-height:1.05}
.ov p{max-width:380px;opacity:.82;line-height:1.5;font-size:calc(15px*var(--fs))}
.ov .keys{font-size:12.5px;opacity:.7;max-width:380px;line-height:1.6;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 12px}
.ov .big{font-size:60px;font-weight:700;line-height:1;letter-spacing:-2px;background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ov .btn{margin-top:6px;min-width:170px}
.ov .sub{display:flex;gap:8px;margin-top:2px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}}
.hud{position:absolute;z-index:20;pointer-events:none;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.6);color:#fff}
.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:20;pointer-events:none}
.cross:before,.cross:after{content:'';position:absolute;background:#fff;opacity:.85}
.cross:before{left:8px;top:0;width:2px;height:18px}.cross:after{top:8px;left:0;height:2px;width:18px}
.touch{position:absolute;inset:0;z-index:25;touch-action:none}
.joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:none;pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.4)}
.tbtns{position:absolute;right:16px;bottom:22px;display:flex;flex-wrap:wrap-reverse;gap:10px;width:170px;justify-content:flex-end}
.tbtn{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:13px;touch-action:none}
.tbtn.on{background:rgba(255,255,255,.35)}
/* small DOM games */
.dom{color:#eef0ff}
.gbtn{font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;transition:background .12s,transform .1s}
.gbtn:hover{background:rgba(255,255,255,.14)}
.gbtn:active{transform:scale(.96)}
.gbtn.on{background:#eef0ff;color:#0b0c18}
.gbtn:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);padding:7px 14px;border-radius:12px;text-align:center;font-weight:700;min-width:70px}
.stat small{display:block;font-size:10px;opacity:.6;letter-spacing:1px;font-weight:500}
/* ---------- settings ---------- */
#settings{position:fixed;inset:0;z-index:200;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:40px 14px;overflow:auto}
#settings.on{display:flex;animation:fadeIn .15s}
.sheet{width:min(560px,100%);border-radius:24px;background:var(--bg2);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5);color:var(--text);animation:pop .22s cubic-bezier(.2,.8,.3,1.3);overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.sheet header h3{font-size:20px}
.tabs{display:flex;gap:4px;padding:10px 14px 0;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--panel2);color:var(--text)}
.pane{padding:6px 20px 20px;display:none}
.pane.on{display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{font-weight:600;font-size:14px}
.row label small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--panel2);flex-wrap:wrap;justify-content:flex-end}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw{width:46px;height:28px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);position:relative;flex:none;transition:background .15s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.sw.on{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw.on:after{transform:translateX(18px);background:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:170px;height:6px;border-radius:999px;background:var(--panel2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));cursor:pointer;border:2px solid #fff}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--a2);cursor:pointer;border:2px solid #fff}
.swatches{display:flex;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;transition:transform .12s}
.swatches button.on{border-color:var(--text);transform:scale(1.12)}
.danger{color:#ff6b81!important;border-color:rgba(255,107,129,.4)!important}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:300;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="hub">
  <div class="top"><div class="wrap">
    <div class="logo"><i>🕹️</i><span>Arcade Hub</span></div>
    <label class="search"><input id="q" placeholder="Search games…" autocomplete="off"><kbd>/</kbd></label>
    <button class="iconbtn" id="rnd" title="Random game">🎲</button>
    <button class="iconbtn" id="openSet" title="Settings">⚙️</button>
  </div></div>
  <div class="wrap">
    <section class="hero">
      <div class="hero-main"><div class="deco">🎮</div><h1 class="grad" id="heroTitle">Arcade Hub</h1><p id="sub"></p><div class="row"><button class="btn" id="heroPlay">Play something random</button><button class="btn ghost" id="heroFav">★ Favorites</button></div></div>
      <div class="hero-side">
        <div class="kpi"><b id="kGames">0</b><span>Games</span></div>
        <div class="kpi"><b id="kPlayed">0</b><span>Sessions played</span></div>
        <div class="kpi"><b id="kFav">0</b><span>Favorites</span></div>
        <div class="kpi"><b id="kBest">0</b><span>Games with a best</span></div>
      </div>
    </section>
    <div id="recentWrap"><div class="sec"><h2>Jump back in</h2><small>Recently played</small></div><div class="rail" id="recent"></div></div>
    <div class="sec"><h2 id="listTitle">All games</h2><small id="count"></small></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No games match that. Try another search or category.</div>
  </div>
</div>
<div id="play">
  <div id="stage"></div>
  <div class="gbar">
    <div class="pill"><button id="back" title="Back to hub (Esc)">← Hub</button><span class="title" id="gTitle"></span></div>
    <div class="sp"></div>
    <div class="pill"><button id="gRestart" title="Restart">↻</button><button id="gMute" title="Sound">🔊</button><button id="gFull" title="Fullscreen">⛶</button><button id="gSet" title="Settings">⚙️</button></div>
  </div>
</div>
<div id="settings"><div class="sheet">
  <header><h3>Settings</h3><button class="iconbtn" id="closeSet">✕</button></header>
  <div class="tabs" id="setTabs"><button data-t="look" class="on">Appearance</button><button data-t="audio">Sound</button><button data-t="ctrl">Controls</button><button data-t="a11y">Accessibility</button><button data-t="data">Data</button></div>
  <div class="pane on" data-p="look">
    <div class="row"><label>Theme<small>Colors for the hub and menus</small></label><div class="seg" data-k="theme"><button data-v="dark">Dark</button><button data-v="midnight">Midnight</button><button data-v="dusk">Dusk</button><button data-v="light">Light</button></div></div>
    <div class="row"><label>Accent</label><div class="swatches" data-k="accent"><button data-v="aurora" style="background:linear-gradient(135deg,#9fb4ff,#ff9ad5)"></button><button data-v="ocean" style="background:linear-gradient(135deg,#5ee7df,#4a8cff)"></button><button data-v="sunset" style="background:linear-gradient(135deg,#ffb347,#ff5e62)"></button><button data-v="lime" style="background:linear-gradient(135deg,#c6ff6b,#3ddc84)"></button><button data-v="mono" style="background:linear-gradient(135deg,#fff,#888)"></button></div></div>
    <div class="row"><label>Card size</label><div class="seg" data-k="density"><button data-v="comfy">Comfortable</button><button data-v="compact">Compact</button></div></div>
    <div class="row"><label>Show "Jump back in"<small>Recently played row on the hub</small></label><button class="sw" data-k="showRecent"></button></div>
  </div>
  <div class="pane" data-p="audio">
    <div class="row"><label>Sound effects</label><button class="sw" data-k="sound"></button></div>
    <div class="row"><label>Volume</label><input type="range" min="0" max="100" data-k="volume"></div>
    <div class="row"><label>Test</label><button class="gbtn" id="testSnd" style="color:var(--text);border-color:var(--line2);background:var(--panel2)">Play a sound</button></div>
  </div>
  <div class="pane" data-p="ctrl">
    <div class="row"><label>Mouse / drag look speed<small>3D games</small></label><input type="range" min="20" max="250" data-k="sens"></div>
    <div class="row"><label>Invert vertical look</label><button class="sw" data-k="invertY"></button></div>
    <div class="row"><label>On-screen controls<small>Joystick & buttons in 3D games</small></label><div class="seg" data-k="touchUI"><button data-v="auto">Auto</button><button data-v="on">Always</button><button data-v="off">Never</button></div></div>
  </div>
  <div class="pane" data-p="a11y">
    <div class="row"><label>Reduce motion<small>Turns off UI animations and screen shake</small></label><button class="sw" data-k="reduceMotion"></button></div>
    <div class="row"><label>Larger text</label><button class="sw" data-k="largeText"></button></div>
  </div>
  <div class="pane" data-p="data">
    <div class="row"><label>Best scores<small>Saved in this browser only</small></label><button class="gbtn danger" id="clrBest">Reset all</button></div>
    <div class="row"><label>Favorites & history</label><button class="gbtn danger" id="clrFav">Clear</button></div>
    <div class="row"><label>Settings</label><button class="gbtn danger" id="clrSet">Restore defaults</button></div>
  </div>
</div></div>
<div id="toast"></div>
<script>
/* ================= shared helpers ================= */
const GAMES = [];
const TOUCH_HW = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0 && matchMedia('(pointer:coarse)').matches);
const SET_DEFAULTS = { theme:'dark', accent:'aurora', density:'comfy', showRecent:true, sound:true, volume:70, sens:100, invertY:false, touchUI:'auto', reduceMotion:false, largeText:false };
let SET = Object.assign({}, SET_DEFAULTS);
try { Object.assign(SET, JSON.parse(localStorage.getItem('arcadehub_settings') || '{}')); } catch(e){}
let isTouch = SET.touchUI === 'on' || (SET.touchUI !== 'off' && TOUCH_HW);
const VOL = () => SET.sound ? (SET.volume/100)*1.4 : 0;
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;

const Store = {
  get(k, d=0){ try { const v = localStorage.getItem('arcadehub_'+k); return v==null?d:JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('arcadehub_'+k, JSON.stringify(v)); } catch(e){} },
  best(id, score, lowerIsBetter=false){
    const b = Store.get('best_'+id, null);
    const better = b==null || (lowerIsBetter ? score < b : score > b);
    if (better) Store.set('best_'+id, score);
    return {best: better ? score : b, isNew: better};
  }
};

let AC = null;
function audioInit(){
  if (!AC){ try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ AC=null; } }
  if (AC && AC.state==='suspended') AC.resume().catch(()=>{});
}
function beep(freq, dur=0.12, type='sine', vol=0.12, slide=0, when=0){
  if (!AC) return;
  try {
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+when;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
    const vv = Math.max(0.0002, vol*VOL()); if (!VOL()) return; g.gain.setValueAtTime(vv,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.03);
  } catch(e){}
}
function noise(dur=0.08, vol=0.08, when=0, hp=4000){
  if (!AC) return;
  try {
    const n = Math.floor(AC.sampleRate*dur), buf = AC.createBuffer(1,n,AC.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
    const s = AC.createBufferSource(); s.buffer = buf;
    const f = AC.createBiquadFilter(); f.type='highpass'; f.frequency.value = hp;
    if (!VOL()) return; const g = AC.createGain(); g.gain.value = vol*VOL();
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(AC.currentTime+when);
  } catch(e){}
}

function makeCtx(stage, game={}){
  const offs = []; let alive = true;
  const ctx = {
    el: stage, isTouch, game,
    get alive(){ return alive; },
    on(t,e,f,o){ t.addEventListener(e,f,o); offs.push(()=>t.removeEventListener(e,f,o)); },
    cleanup(f){ offs.push(f); },
    loop(fn){
      let last = performance.now();
      const step = now => {
        if (!alive) return;
        const dt = Math.min((now-last)/1000, 0.05); last = now;
        try { fn(dt, now/1000); } catch(err){ console.error(err); }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },
    div(cls, html='', parent=stage){ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; parent.appendChild(d); return d; },
    // overlay panel: show({title, html, button, onClick})
    panel(){
      const ov = ctx.div('ov hide');
      return {
        el: ov,
        show({title='', html='', button='Play', onClick}={}){
          ov.innerHTML = `<div class="box">${game.emoji?`<div class="gico" style="background:${game.bg}">${game.emoji}</div>`:''}<h2>${title}</h2>${html}${button?`<button class="btn main">${button}</button>`:''}</div>`;
          ov.classList.remove('hide');
          const b = ov.querySelector('.btn.main');
          if (b) b.addEventListener('click', e => { e.stopPropagation(); audioInit(); onClick && onClick(); });
        },
        hide(){ ov.classList.add('hide'); },
        get visible(){ return !ov.classList.contains('hide'); }
      };
    },
    canvas2d(onResize){
      const cv = document.createElement('canvas'); stage.appendChild(cv);
      const g = cv.getContext('2d');
      const r = { cv, g, W:0, H:0 };
      const resize = () => {
        const dpr = Math.min(devicePixelRatio||1, 2);
        r.W = stage.clientWidth; r.H = stage.clientHeight;
        cv.width = r.W*dpr; cv.height = r.H*dpr; cv.style.width = r.W+'px'; cv.style.height = r.H+'px';
        g.setTransform(dpr,0,0,dpr,0,0);
        onResize && onResize(r.W, r.H);
      };
      resize(); ctx.on(window,'resize',resize);
      return r;
    },
    three(){
      if (!window.THREE){ ctx.div('ov','<div class="box"><h2>3D engine didn\'t load</h2><p>Check your connection and reload the page.</p></div>'); return null; }
      const renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
      stage.appendChild(renderer.domElement);
      const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 600);
      const scene = new THREE.Scene();
      const resize = () => { const w=stage.clientWidth, h=stage.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); };
      resize(); ctx.on(window,'resize',resize);
      ctx.cleanup(() => { scene.traverse(o => { if (o.geometry) o.geometry.dispose(); }); renderer.dispose(); try { renderer.forceContextLoss(); } catch(e){} });
      return { renderer, camera, scene };
    },
    // pointer lock look for desktop 3D games
    mouseLook(target, onMove, onLockChange){
      ctx.on(document, 'mousemove', e => { if (document.pointerLockElement === target) { const k = SET.sens/100; onMove((e.movementX||0)*k, (e.movementY||0)*k*(SET.invertY?-1:1)); } });
      ctx.on(document, 'pointerlockchange', () => onLockChange && onLockChange(document.pointerLockElement === target));
      ctx.cleanup(() => { if (document.pointerLockElement) try { document.exitPointerLock(); } catch(e){} });
      return { lock(){ try { const p = target.requestPointerLock(); if (p && p.catch) p.catch(()=>{}); } catch(e){} }, get locked(){ return document.pointerLockElement === target; } };
    },
    keys(){
      const k = {}, pressed = {};
      ctx.on(window,'keydown', e => { if (!k[e.code]) pressed[e.code] = true; k[e.code] = true; if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
      ctx.on(window,'keyup', e => { k[e.code] = false; });
      ctx.on(window,'blur', () => { for (const c in k) k[c] = false; });
      return { down: c => !!k[c], hit: c => { const v = !!pressed[c]; pressed[c] = false; return v; }, clear(){ for (const c in pressed) pressed[c]=false; } };
    },
    // on-screen joystick + look-drag + buttons (touch only)
    touchPad(buttons){
      const st = { mx:0, my:0, lx:0, ly:0, btn:{}, hit:{} , el:null };
      st.take = name => { const v = !!st.hit[name]; st.hit[name]=false; return v; };
      if (!isTouch) return st;
      const root = ctx.div('touch'); st.el = root;
      const joy = ctx.div('joy','<i></i>',root), knob = joy.firstChild;
      const bwrap = ctx.div('tbtns','',root);
      buttons.forEach(name => {
        const b = document.createElement('button'); b.className='tbtn'; b.textContent=name; bwrap.appendChild(b);
        b.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); audioInit(); st.btn[name]=true; st.hit[name]=true; b.classList.add('on'); });
        const up = e => { e.stopPropagation(); st.btn[name]=false; b.classList.remove('on'); };
        b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
      });
      let jid=null, lid=null, ox=0, oy=0, lxp=0, lyp=0;
      root.addEventListener('pointerdown', e => {
        audioInit();
        const r = root.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
        if (x < r.width*0.45 && jid===null){ jid=e.pointerId; ox=x; oy=y; joy.style.left=x+'px'; joy.style.top=y+'px'; joy.style.display='block'; knob.style.transform=''; }
        else if (lid===null){ lid=e.pointerId; lxp=e.clientX; lyp=e.clientY; }
      });
      root.addEventListener('pointermove', e => {
        if (e.pointerId===jid){
          const r = root.getBoundingClientRect(); let dx=e.clientX-r.left-ox, dy=e.clientY-r.top-oy;
          const m = Math.hypot(dx,dy), R=50; if (m>R){ dx*=R/m; dy*=R/m; }
          st.mx = dx/R; st.my = dy/R; knob.style.transform=`translate(${dx}px,${dy}px)`;
        } else if (e.pointerId===lid){ const k = SET.sens/100; st.lx += (e.clientX-lxp)*k; st.ly += (e.clientY-lyp)*k*(SET.invertY?-1:1); lxp=e.clientX; lyp=e.clientY; }
      });
      const end = e => { if (e.pointerId===jid){ jid=null; st.mx=st.my=0; joy.style.display='none'; } if (e.pointerId===lid) lid=null; };
      root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end);
      return st;
    },
    // ---- helpers for the smaller games ----
    _p: null,
    intro(title, html, onStart, button='Play'){
      const p = ctx._p || (ctx._p = ctx.panel());
      p.show({ title, html, button, onClick(){ p.hide(); onStart(); } }); return p;
    },
    over(id, score, onAgain, o={}){
      const r = Store.best(id, score, o.lower), f = o.fmt || (v => v);
      const p = ctx._p || (ctx._p = ctx.panel());
      p.show({ title: o.title || 'Game over', html: `<div class="big">${f(score)}</div><p>${r.isNew ? 'New best!' : 'Best ' + f(r.best)}${o.extra ? ' · ' + o.extra : ''}</p>`, button: o.button || 'Play again', onClick(){ p.hide(); onAgain(); } });
      return r;
    },
    // fixed-size virtual canvas, scaled to fit under the top bar
    virtual(VW, VH, bg='#000'){
      const v = { W:VW, H:VH, sc:1, ox:0, oy:0 };
      const fit = (w,h) => { v.sc = Math.min(w/VW, (h-56)/VH); v.ox = (w - VW*v.sc)/2; v.oy = 56 + ((h-56) - VH*v.sc)/2; };
      const C = ctx.canvas2d(fit); v.cv = C.cv; v.g = C.g; const g = C.g;
      v.begin = () => { const d = Math.min(devicePixelRatio||1,2); g.setTransform(d,0,0,d,0,0); g.fillStyle = bg; g.fillRect(0,0,C.W,C.H); g.setTransform(d*v.sc,0,0,d*v.sc,d*v.ox,d*v.oy); g.save(); g.beginPath(); g.rect(0,0,VW,VH); g.clip(); };
      v.end = () => g.restore();
      v.local = e => { const r = C.cv.getBoundingClientRect(); return { x:(e.clientX-r.left-v.ox)/v.sc, y:(e.clientY-r.top-v.oy)/v.sc }; };
      v.text = (s, x, y, size=20, col='#fff', align='center', weight=700) => { g.fillStyle = col; g.font = `${weight} ${size}px Space Grotesk, sans-serif`; g.textAlign = align; g.fillText(s, x, y); g.textAlign = 'left'; };
      return v;
    },
    swipe(el, onDir, onTap){
      let sx = null, sy = 0, moved = false;
      ctx.on(el, 'pointerdown', e => { sx = e.clientX; sy = e.clientY; moved = false; audioInit(); });
      ctx.on(el, 'pointermove', e => { if (sx == null || moved) return; const dx = e.clientX-sx, dy = e.clientY-sy; if (Math.hypot(dx,dy) > 28){ moved = true; Math.abs(dx) > Math.abs(dy) ? onDir(Math.sign(dx),0) : onDir(0,Math.sign(dy)); } });
      ctx.on(el, 'pointerup', e => { if (sx != null && !moved && onTap) onTap(e); sx = null; });
    },
    dom(css=''){ const d = ctx.div('dom',''); d.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#14111f;padding:60px 12px 20px;touch-action:manipulation;overflow:auto;' + css; return d; },
    destroy(){ alive=false; offs.reverse().forEach(f=>{ try{f();}catch(e){} }); stage.innerHTML=''; }
  };
  return ctx;
}
</script>
